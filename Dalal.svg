<svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    svg {
      font-weight: 800;
      font-family: Georgia, 'Palatino Linotype', serif;
    }
    .text-copy {
      fill: none;
      stroke-dasharray: 6% 29%;
      stroke-width: 4.5px;
      stroke-dashoffset: 0%;
      animation: stroke-offset 5.5s infinite linear;
    }
    .en .text-copy { font-size: 96px; }
    .ar .text-copy {
      font-size: 60px;
      stroke-width: 3px;
      font-family: 'Amiri', 'Traditional Arabic', 'Geeza Pro', serif;
    }
    .text-copy:nth-child(1){ stroke: #FF2E4C; animation-delay: -1s; }
    .text-copy:nth-child(2){ stroke: #9B5DE5; animation-delay: -2s; }
    .text-copy:nth-child(3){ stroke: #FF6EC7; animation-delay: -3s; }
    .text-copy:nth-child(4){ stroke: #FF8C2E; animation-delay: -4s; }
    .text-copy:nth-child(5){ stroke: #E4008C; animation-delay: -5s; }
    @keyframes stroke-offset{
      100% { stroke-dashoffset: -35%; }
    }
    .quote {
      font-family: Georgia, 'Palatino Linotype', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 24px;
      fill: #FF6EC7;
      opacity: 0;
      animation: fadeIn 2s ease-out 0.8s forwards;
    }
    .quote-author {
      font-family: Georgia, serif;
      font-style: normal;
      font-weight: 400;
      font-size: 16px;
      letter-spacing: 2px;
      fill: #9B5DE5;
      opacity: 0;
      animation: fadeIn 2s ease-out 1.6s forwards;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>

  <rect width="100%" height="100%" fill="#0D1117" rx="14"/>

  <symbol id="s-en">
    <text text-anchor="middle" x="50%" y="30%">Dalal NsrAllah</text>
  </symbol>
  <symbol id="s-ar">
    <text text-anchor="middle" x="50%" y="62%" direction="rtl">دلال نصرالله</text>
  </symbol>

  <g class="en">
    <use href="#s-en" class="text-copy"></use>
    <use href="#s-en" class="text-copy"></use>
    <use href="#s-en" class="text-copy"></use>
    <use href="#s-en" class="text-copy"></use>
    <use href="#s-en" class="text-copy"></use>
  </g>

  <g class="ar">
    <use href="#s-ar" class="text-copy"></use>
    <use href="#s-ar" class="text-copy"></use>
    <use href="#s-ar" class="text-copy"></use>
    <use href="#s-ar" class="text-copy"></use>
    <use href="#s-ar" class="text-copy"></use>
  </g>

  <text x="50%" y="282" text-anchor="middle" class="quote">&#8220;Visible where visibility is dignity, invisible where invisibility is life.&#8221;</text>
  <text x="50%" y="316" text-anchor="middle" class="quote-author">&#8212; DALAL NSRALLAH</text>
</svg>
